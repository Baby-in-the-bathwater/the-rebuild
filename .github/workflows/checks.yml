name: Checks

# Runs on every pull request into main and on every push to main. Required to pass before a
# pull request can merge (the "Main" ruleset). Nothing here touches Sleeper or any league.
# The deploy workflow also calls it, so nothing deploys unless these pass.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - run: pip install -r requirements.txt
      - name: Python tests
        run: python -m unittest discover tests -v
      - name: Trade board tests
        run: node --test tests/board_weights.test.js
      - name: Web install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Web type-check
        working-directory: web
        run: pnpm typecheck
      - name: Web tests
        working-directory: web
        run: pnpm test
      - name: Web build
        working-directory: web
        run: pnpm build
      - name: CLI loads
        run: python -m rebuild --help
      - name: Public-data guard (no league ids, run output or cache)
        run: python .github/scripts/public_data_guard.py
