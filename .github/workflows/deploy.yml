name: Deploy

# Deploys the static site in web/ to Cloudflare Workers.
#   - A push to main that touches the site, the engine or the benchmarks it bundles deploys to staging.
#   - A daily schedule deploys staging too, to refresh the player file and the snapshot index (web/scripts/build_data.py).
#   - "Run workflow" deploys to the environment you pick.
# The account comes from two secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, set on the
# repository or on the GitHub environment of the same name (staging, production). In a repository
# that has neither, the deploy is skipped with a notice instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "rebuild/**"
      - "benchmarks/**"
      - ".github/workflows/deploy.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'staging' }}
    env:
      TARGET: ${{ inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Look for Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set for $TARGET."
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.present == 'true'
        with:
          package_json_file: web/package.json
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install
        if: steps.secrets.outputs.present == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Data files
        # Only on the deploy path. A failure stops the job here, before anything is deployed.
        if: steps.secrets.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python web/scripts/build_data.py --out web/public/data
      - name: Build
        if: steps.secrets.outputs.present == 'true'
        working-directory: web
        run: pnpm build
      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          packageManager: pnpm
          command: deploy --env ${{ env.TARGET }}
      - name: Site responds
        if: steps.secrets.outputs.present == 'true'
        working-directory: web
        env:
          SITE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Wrangler reported no deployment address."
            exit 1
          fi
          SITE_URL="${SITE_URL%/}"
          PYODIDE="$(node -p "require('./node_modules/pyodide/package.json').version")"
          # data-page="form" is the front page's own marker (src/ui/main.ts reads it).
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "$SITE_URL" | grep -q 'data-page="form"'; then
              echo "Front page is up."
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::The front page did not respond with the expected page."
              exit 1
            fi
            echo "Attempt $attempt: not up yet, waiting."
            sleep 10
          done
          failed=0
          for path in /board /data/players.json /data/snapshot_index.json /engine/engine.zip "/pyodide/$PYODIDE/pyodide.asm.wasm"; do
            code="$(curl --silent --output /dev/null --location --max-time 60 --write-out '%{http_code}' "$SITE_URL$path" || true)"
            echo "$code $path"
            if [ "$code" != 200 ]; then
              echo "::error::$path answered $code, not 200."
              failed=1
            fi
          done
          exit "$failed"
