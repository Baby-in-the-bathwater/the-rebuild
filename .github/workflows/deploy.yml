name: Deploy

# Deploys the static site in web/ to Cloudflare Workers.
#   - A push to main that touches the site or the engine deploys to staging.
#   - "Run workflow" deploys to the environment you pick.
# The account comes from two secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, set on the
# repository or on the GitHub environment of the same name (staging, production). In a repository
# that has neither, the deploy is skipped with a notice instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "rebuild/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment || 'staging' }}
    env:
      TARGET: ${{ inputs.environment || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Look for Cloudflare secrets
        id: secrets
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set for $TARGET."
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.present == 'true'
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.present == 'true'
        with:
          package_json_file: web/package.json
      - name: Install
        if: steps.secrets.outputs.present == 'true'
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.secrets.outputs.present == 'true'
        working-directory: web
        run: pnpm build
      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          packageManager: pnpm
          command: deploy --env ${{ env.TARGET }}
      - name: Front page responds
        if: steps.secrets.outputs.present == 'true'
        env:
          SITE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "::error::Wrangler reported no deployment address."
            exit 1
          fi
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "$SITE_URL" | grep -q 'engine-status'; then
              echo "Front page is up."
              exit 0
            fi
            echo "Attempt $attempt: not up yet, waiting."
            sleep 10
          done
          echo "::error::The front page did not respond with the expected page."
          exit 1
