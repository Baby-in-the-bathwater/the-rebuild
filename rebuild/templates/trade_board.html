<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Sleeper-style trade page. Your roster pinned left, chosen counterparty right, deal rail between them on desktop and above the panels on a phone. Dark-first, Sleeper position hues. */
:root{
  --bg:#0f1420; --panel:#171d2c; --panel2:#1e2536; --line:#2a3245; --fg:#e8ecf4; --muted:#8e98ad; --accent:#f5c542;
  --qb:#f8296d; --rb:#00ceb8; --wr:#58a7ff; --te:#ffae58; --k:#b1b7c6; --def:#bd66ff; --pick:#c9d1e0;
  --send:#ff6b6b; --recv:#4cd97b; --glow:0 0 0 2px var(--accent);
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){ --bg:#f3f4f8; --panel:#ffffff; --panel2:#eef0f6; --line:#d8dce6; --fg:#141a28; --muted:#5d6678; --accent:#b8860b; --qb:#d81b5c; --rb:#0e9f8f; --wr:#2a6fd6; --te:#d97a1a; --k:#6b7385; --def:#8e3fd9; --pick:#3b4356; --send:#c93b3b; --recv:#1f8a4c; color-scheme:light } }
:root[data-theme="light"]{ --bg:#f3f4f8; --panel:#ffffff; --panel2:#eef0f6; --line:#d8dce6; --fg:#141a28; --muted:#5d6678; --accent:#b8860b; --qb:#d81b5c; --rb:#0e9f8f; --wr:#2a6fd6; --te:#d97a1a; --k:#6b7385; --def:#8e3fd9; --pick:#3b4356; --send:#c93b3b; --recv:#1f8a4c; color-scheme:light }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.35;padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.01em}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;padding:18px 0 12px;border-bottom:1px solid var(--line)}
.top h1{font-size:30px;line-height:1;text-transform:uppercase}
.top .sub{color:var(--muted);font-size:13px}
.call{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:4px;font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:#1a1400;vertical-align:middle}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0}
.tab{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 12px;font:600 13px var(--body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:#1a1400;border-color:var(--accent)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--recv);margin-left:6px;vertical-align:1px}
.tab[aria-selected="true"] .dot{background:#1a1400}
.tab:focus-visible,.deal:focus-visible,.var:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* deal strip above, rosters side by side below in a horizontal scroller */
.dealbar{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:14px}
@media (max-width:860px){.dealbar{grid-template-columns:1fr}}
.dealbar .panel{padding:12px}
.dealbar h3{font-size:18px;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.dealbar .deals{max-height:340px;overflow-y:auto}
.mgrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.mgrid .mside{flex:1 1 240px;margin-top:0;min-width:0}
.tfoot{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
.tfoot .big{font:700 26px var(--display)}.tfoot .big.good{color:var(--recv)}.tfoot .big.bad{color:var(--send)}
.rosters{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;align-items:start}
.rosters > .panel{flex:0 0 min(500px,92vw);scroll-snap-align:start}
/* two teams on screen: the old three-column board, your roster | deals and trade | theirs. A third roster reflows to the strip-above layout. */
#board.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,340px) minmax(0,1fr);gap:14px;align-items:start}
#board.duo .rosters{display:contents}
#board.duo .rosters > .panel:first-child{order:1}
#board.duo .dealbar{order:2;grid-template-columns:1fr;margin-bottom:0}
#board.duo .rosters > .panel:last-child{order:3}
#board.duo .mgrid{flex-direction:column}
#board.duo .mgrid .mside{flex:none}
@media (max-width:980px){#board.duo{grid-template-columns:1fr}#board.duo .dealbar{order:0}}
.phead{position:relative}
.unpin{position:absolute;top:8px;right:10px;appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;font:700 13px var(--body);line-height:1;padding:4px 7px;cursor:pointer}
.unpin:hover{color:var(--send);border-color:var(--send)}.unpin:focus-visible,.pin:focus-visible{outline:2px solid var(--accent)}
.phead .focus{font:700 10px var(--display);letter-spacing:.06em;text-transform:uppercase;color:#1a1400;background:var(--accent);border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:4px}
.tabw{display:inline-flex;align-items:stretch}
.tabw .tab{border-radius:999px 0 0 999px}
.pin{appearance:none;border:1px solid var(--line);border-left:0;background:var(--panel);color:var(--muted);border-radius:0 999px 999px 0;padding:0 10px;font:700 14px var(--body);cursor:pointer}
.pin[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 25%,var(--panel));color:var(--fg)}
.tab.shown:not([aria-selected="true"]){border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;overflow:hidden}
.phead{padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.phead h2{font-size:24px;text-transform:uppercase;line-height:1}
.phead .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12px;margin-top:4px;font-variant-numeric:tabular-nums}
.phead .meta b{color:var(--fg);font-weight:600}
.group{padding:8px 10px 2px}
.gh{display:flex;align-items:center;gap:8px;font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 4px 4px}
.gh .bar{height:3px;flex:1;border-radius:2px;opacity:.85}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) 40px 32px 44px 40px 56px;gap:0 8px;align-items:center;padding:5px 4px;border-radius:6px;font-variant-numeric:tabular-nums}
.row + .row{border-top:1px solid var(--line)}
.row.hl{box-shadow:var(--glow);background:color-mix(in srgb,var(--accent) 12%,transparent);border-top-color:transparent}
.row.hl.send{box-shadow:0 0 0 2px var(--send);background:color-mix(in srgb,var(--send) 14%,transparent)}
.row.hl.recv{box-shadow:0 0 0 2px var(--recv);background:color-mix(in srgb,var(--recv) 14%,transparent)}
.row.sell .nm::after{content:"SELL";font:700 10px var(--display);letter-spacing:.05em;color:var(--send);margin-left:6px}
.row.hold .nm::after{content:"HOLD";font:700 10px var(--display);letter-spacing:.05em;color:var(--accent);margin-left:6px}
.badge{font:700 11px var(--display);letter-spacing:.06em;color:#0b0e14;border-radius:4px;padding:3px 0;text-align:center}
.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.nm small{color:var(--muted);font-weight:400;margin-left:5px}
.tag{display:inline-block;font:700 10px var(--display);letter-spacing:.05em;padding:1px 4px;border-radius:3px;margin-left:5px;vertical-align:1px}
.tag.ir{background:var(--send);color:#fff}.tag.bl{background:var(--recv);color:#0b0e14}.tag.sh{background:var(--te);color:#0b0e14}
.num.pv.up{color:var(--recv)}.num.pv.down{color:var(--te)}.num.pv.tagged{font-weight:700}.tag.st{background:var(--line);color:var(--fg)}.tag.tx{background:var(--def);color:#fff}
.num{color:var(--muted);font-size:12px;text-align:right}
.num.val{font-family:var(--mono);color:var(--fg);font-size:12px}
.num.ppg.good{color:var(--recv);font-weight:600}
.cols{display:grid;grid-template-columns:36px minmax(0,1fr) 40px 32px 44px 40px 56px;gap:0 8px;padding:8px 14px 0;font:700 10px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cols span:nth-child(n+3){text-align:right}
.picks{padding:10px 10px 12px}
.season{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;align-items:start;padding:5px 4px}
.season + .season{border-top:1px solid var(--line)}
.season .yr{font:700 16px var(--display);color:var(--muted);padding-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:4px 7px;font-size:12px;background:var(--panel2);font-variant-numeric:tabular-nums}
.chip .r{font:700 11px var(--display);padding:1px 5px;border-radius:3px;color:#0b0e14}
.chip .r1{background:var(--accent)}.chip .r2{background:var(--pick)}.chip .r3,.chip .r4,.chip .r5{background:var(--muted)}
.chip small{color:var(--muted)}
.chip .v{font-family:var(--mono);font-size:11px;color:var(--fg)}
.chip.hl{box-shadow:var(--glow)}.chip.hl.recv{box-shadow:0 0 0 2px var(--recv);background:color-mix(in srgb,var(--recv) 14%,var(--panel2))}.chip.hl.send{box-shadow:0 0 0 2px var(--send);background:color-mix(in srgb,var(--send) 14%,var(--panel2))}
.none{color:var(--muted);font-size:12px;padding-top:4px}
.deals{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.deal{appearance:none;text-align:left;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:8px;padding:8px 10px;font:500 13px var(--body);cursor:pointer}
.deal[aria-selected="true"]{border-color:var(--accent)}
.deal small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.vars{display:flex;gap:6px;margin-top:10px}
.var{flex:1;appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:6px;padding:6px 0;font:700 12px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.var[aria-selected="true"]{background:var(--accent);color:#1a1400;border-color:var(--accent)}
.side{margin-top:10px}
.side .lbl{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between}
.side .lbl.send{color:var(--send)}.side .lbl.recv{color:var(--recv)}
.side ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.side li{display:flex;justify-content:space-between;gap:8px;font-size:13px;background:var(--panel2);border-radius:5px;padding:4px 8px;font-variant-numeric:tabular-nums}
.side li .iv{font-family:var(--mono);font-size:12px;color:var(--muted)}
.side li{flex-wrap:wrap;align-items:center}
.side li .il{flex:1;min-width:0}
.side li .il small{color:var(--muted);margin-left:4px}
.side li[draggable="true"]{cursor:grab}
.side li.dragging{opacity:.45}
.drop-ok{outline:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.drop-over{outline:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.dealbar.solo{grid-template-columns:1fr}
.rm{appearance:none;border:0;background:none;color:var(--muted);font:700 14px var(--body);line-height:1;padding:0 2px;cursor:pointer}
.rm:hover{color:var(--send)}.rm:focus-visible{outline:2px solid var(--accent)}
.mside{margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:8px}
.mside.me{border-color:var(--accent)}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.mh b{font-weight:600}.mh .p{font:700 18px var(--display)}.mh .p.good{color:var(--recv)}.mh .p.bad{color:var(--send)}
.mt{margin-top:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.mt b{color:var(--fg)}
.why{margin-top:8px;font-size:12px;color:var(--muted);border-left:2px solid var(--accent);padding-left:8px}
.deal.multi small::before{content:"3-TEAM";font:700 10px var(--display);letter-spacing:.06em;color:#0b0e14;background:var(--accent);border-radius:3px;padding:0 4px;margin-right:6px}
.sect{font-size:22px;text-transform:uppercase;margin:22px 0 8px}
.vcol li .lb small{color:var(--muted);margin-left:4px}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.tot .big{font:700 26px var(--display)}
.tot .big.good{color:var(--recv)}.tot .big.bad{color:var(--send)}
.walk{margin-top:8px;font-size:12px;color:var(--muted)}
.walk b{color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:12px;padding:10px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.note{color:var(--muted);font-size:12px;margin-top:10px}
.summary{margin:12px 0 0;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-size:13px}
.summary b{color:var(--accent)}
.summary ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
[data-key]{cursor:pointer}
.row[data-key]:hover:not(.hl),.chip[data-key]:hover:not(.hl){background:color-mix(in srgb,var(--fg) 6%,transparent)}
[data-key]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.vars.custom .var{opacity:.55}.vars.custom .var:hover{opacity:1}
.custom-head{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.clear{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:6px;padding:3px 8px;font:700 11px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.side li.empty{color:var(--muted);font-style:italic;justify-content:center}
.hint{margin-top:8px;font-size:12px;color:var(--muted)}
.who{text-transform:none;font:500 .62em var(--body);letter-spacing:0;color:var(--muted);margin-left:6px;vertical-align:.12em}
.tab .who{font-size:12px;margin-left:4px;vertical-align:0}
.tab[aria-selected="true"] .who{color:#1a1400;opacity:.75}
/* view switch + all-deals comparison */
.views{display:inline-flex;gap:0;margin-top:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.view{appearance:none;border:0;background:var(--panel);color:var(--muted);padding:7px 14px;font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.view + .view{border-left:1px solid var(--line)}
.view[aria-selected="true"]{background:var(--accent);color:#1a1400}
.view:focus-visible,.open:focus-visible,.ctl select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 0;color:var(--muted);font-size:12px}
.ctl label{display:inline-flex;align-items:center;gap:6px}
.ctl select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font:500 13px var(--body)}
.cards{display:flex;flex-direction:column;gap:12px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.dcard > header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}
.dcard .rk{font:700 22px var(--display);color:var(--muted);min-width:30px}
.dcard .dt{font:700 19px var(--display);text-transform:uppercase;letter-spacing:.01em;line-height:1.1}
.dcard .dt .arrow{color:var(--muted);margin:0 4px}
.dcard .dm{display:flex;flex-wrap:wrap;gap:3px 12px;color:var(--muted);font-size:12px;margin-top:3px}
.dcard .dm b{color:var(--fg);font-weight:600}
.fit{font:700 10px var(--display);letter-spacing:.06em;padding:1px 5px;border-radius:3px;background:var(--recv);color:#0b0e14;text-transform:uppercase}
.open{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:6px 10px;font:700 12px var(--display);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.open:hover{border-color:var(--accent)}
.vgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.vcol{padding:10px 14px;min-width:0;display:flex;flex-direction:column}
.vcol + .vcol{border-left:1px solid var(--line)}
.vcol.tgt{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.vh{display:flex;justify-content:space-between;align-items:baseline;font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vcol.tgt .vh > span:first-child{color:var(--accent)}
.vh .p{font:700 22px var(--display);color:var(--fg);letter-spacing:0}
.vh .p.good{color:var(--recv)}.vh .p.bad{color:var(--send)}
.vcol ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px;flex:1}
.vcol li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.vcol li .badge{font-size:10px;padding:2px 0}
.vcol li .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcol li .vv{font-family:var(--mono);font-size:11px;color:var(--muted)}
.vcol .same{color:var(--muted);font-size:12px;font-style:italic;margin-top:6px;flex:1}
.vt{display:flex;justify-content:space-between;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.vt b{font-family:var(--mono);color:var(--fg);font-weight:500}
.dcard footer{padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.dcard footer b{color:var(--fg)}
@media (max-width:760px){.vgrid{grid-template-columns:1fr}.vcol + .vcol{border-left:0;border-top:1px solid var(--line)}.dcard > header{grid-template-columns:auto minmax(0,1fr)}.dcard .open{grid-column:1 / -1;justify-self:start}}
/* league trade history */
.hsec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.hsec h2{font-size:22px;text-transform:uppercase;line-height:1}
.hsec > .hint{margin:6px 0 0;max-width:80ch}
.tw{overflow-x:auto;margin-top:10px}
.ht{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.ht th{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.ht th:first-child,.ht td:first-child,.ht th.l{text-align:left}
.ht th button{all:unset;cursor:pointer}.ht th button:focus-visible{outline:2px solid var(--accent)}
.ht th[aria-sort] button{color:var(--accent)}
.ht td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.ht tr:last-child td{border-bottom:0}
.ht td.l{text-align:left;white-space:normal}
.ht td small{color:var(--muted);display:block;font-size:11px}
.ht .good{color:var(--recv);font-weight:600}.ht .bad{color:var(--send);font-weight:600}.ht .mid{color:var(--muted)}
.ht tbody tr.me td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.ht.lb tbody tr{cursor:pointer}.ht.lb tbody tr:hover td{background:color-mix(in srgb,var(--fg) 5%,transparent)}
.ht.lb tbody tr.on td{box-shadow:inset 0 -2px 0 var(--accent)}
.tlist{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.tcard{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
.tcard.mine{border-color:var(--accent)}
.tcard > header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.tcard > header b{color:var(--fg);font-weight:600}
.vbadge{font:700 11px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--line);color:var(--fg)}
.vbadge.win{background:var(--recv);color:#0b0e14}
.tsides{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tside{padding:10px 12px;min-width:0;background:var(--panel)}
.tside + .tside{border-left:1px solid var(--line)}
.tside.won{box-shadow:inset 3px 0 0 var(--recv)}
.tsh{font-size:13px}.tsh b{font-weight:600}.tsh small{color:var(--muted)}
.tside ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.tside li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.tside li .badge{font-size:10px;padding:2px 0}
.tside li .lb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tside li .lb small{color:var(--muted);margin-left:4px}
.tside li .vv{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}
.tside li .vv b{color:var(--fg);font-weight:500}
.tst{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:8px;padding-top:6px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tst b{color:var(--fg);font-weight:600}.tst .good{color:var(--recv)}.tst .bad{color:var(--send)}
@media (max-width:620px){.tside + .tside{border-left:0;border-top:1px solid var(--line)}}
[hidden]{display:none !important}
@media (prefers-reduced-motion:no-preference){.row,.chip{transition:box-shadow .15s,background .15s}}
</style>
</head>
<body>
<header class="top">
  <div><h1 id="h1"></h1><div class="sub" id="sub"></div></div>
  <div class="legend"><span><i style="background:var(--qb)"></i>QB</span><span><i style="background:var(--rb)"></i>RB</span><span><i style="background:var(--wr)"></i>WR</span><span><i style="background:var(--te)"></i>TE</span><span><i style="background:var(--def)"></i>DEF</span><span><i style="background:var(--send)"></i>you send</span><span><i style="background:var(--recv)"></i>you receive</span></div>
</header>
<div class="summary" id="summary"></div>
<div class="views" id="views" role="tablist" aria-label="View"></div>
<section id="compare" aria-label="All proposed deals" hidden></section>
<section id="history" aria-label="League trade history" hidden></section>
<div class="tabs" id="tabs" role="tablist" aria-label="Counterparty"></div>
<div id="board">
  <section class="dealbar" id="rail" aria-label="Deals and the current trade"></section>
  <div class="rosters" id="rosters" aria-label="Team rosters"></div>
</div>
<p class="note" id="note"></p>

<script>
const DATA = /*__DATA__*/null;
const ME = DATA.me_rid;
const T = Object.fromEntries(DATA.teams.map(t => [t.rid, t]));
const me = T[ME];
const fmt = n => (n || 0).toLocaleString("en-US");
const POS = ["QB", "RB", "WR", "TE", "K", "DEF"];
const PC = {QB: "var(--qb)", RB: "var(--rb)", WR: "var(--wr)", TE: "var(--te)", K: "var(--k)", DEF: "var(--def)"};
const ord = n => n + (["th","st","nd","rd"][(n%10>3||[11,12,13].includes(n%100))?0:n%10]);
const pad = s => "1." + String(s).padStart(2, "0");
// Sleeper DMs go by username, so show it beside the team name unless the team has no custom name (then the name already is the username).
const handle = t => (t.owner && t.owner !== "(orphan)" && t.owner !== t.name ? t.owner : "");
const who = t => (handle(t) ? `<span class="who">(${handle(t)})</span>` : "");
const SEASONS = DATA.pick_seasons;
const dealsFor = rid => DATA.deals.filter(d => d.cp_rid === rid);
const MULTI = DATA.multi || [];
const multiFor = rid => MULTI.map((m, i) => ({m, i})).filter(x => x.m.teams.includes(rid));
const withDeals = [...new Set([...DATA.deals.map(d => d.cp_rid), ...MULTI.flatMap(m => m.teams.filter(r => r !== ME))])];
const tname = rid => (T[rid] ? T[rid].name : "Team " + rid);
const others = [...withDeals, ...DATA.teams.map(t => t.rid).filter(r => r !== ME && !withDeals.includes(r))];

let sel = {team: others[0], deal: 0, v: null};
try { const s = JSON.parse(localStorage.getItem("rebuild-board-" + DATA.league_id) || "null"); if (s && T[s.team] && s.team !== ME) sel = s; } catch (e) {}
if (sel.custom && !Array.isArray(sel.custom.moves)) sel.custom = null;   // saved by an older board (send/recv lists)
const save = () => { try { localStorage.setItem("rebuild-board-" + DATA.league_id, JSON.stringify(sel)); } catch (e) {} };

// Custom trades: sel.custom is null (show the drafted deal) or {moves: [{key, from, to}], base} built by clicking rows and pick chips.
// Keys are "p:<player id>" or "k:<pick key>". A click on your roster sends the piece to the team on screen; a click on theirs
// sends it to you; each piece's "to" can be changed to any team, which is how a third (or fourth) team joins. `base` names the
// drafted three-team deal the trade was loaded from ("m<index>"), so the rail can say whether it has been edited.
const keyOf = it => (it.kind === "player" ? "p:" + it.id : "k:" + it.key);
const movesOfDeal = m => m.moves.map(x => ({key: keyOf(x), from: x.from, to: x.to}));
const sameMoves = (a, b) => JSON.stringify(a.map(m => [m.key, m.from, m.to]).sort()) === JSON.stringify(b.map(m => [m.key, m.from, m.to]).sort());
const pickLabel = pk => `${pk.season} R${pk.round}` + (pk.own ? "" : ` via ${pk.orig}`) + (pk.proj_slot && pk.round === 1 ? ` (${pad(pk.proj_slot)})` : "");
function assetOf(team, key) {
  const id = key.slice(2);
  if (key.startsWith("p:")) {
    const p = team.players.find(p => String(p.id) === id);
    return p && {kind: "player", id: p.id, label: `${p.name} (${p.pos}, ${p.age ?? "?"})`, value: p.value || 0};
  }
  const pk = team.picks.find(p => p.key === id);
  return pk && {kind: "pick", key: pk.key, label: pickLabel(pk), value: pk.value || 0};
}
let refocus = null;

// All-deals view: every drafted deal as a card, variants side by side, in the brief's ranked order by default.
const PL = Object.fromEntries(DATA.teams.flatMap(t => t.players.map(p => [String(p.id), p])));
const sum = items => items.reduce((a, b) => a + b.value, 0);
const dealAsset = d => d.fixed.map(x => x.label.replace(/ \(.*\)$/, "")).join(" + ");
const dealPct = (d, vname) => {      // value you receive over value you send, for either deal direction
  const f = sum(d.fixed), v = d.vars[vname].value;
  const [out, inn] = d.fixed_side === "sends" ? [f, v] : [v, f];
  return out ? Math.round(inn / out * 100) : null;
};
const pctClass = p => (p === null ? "" : p >= 100 ? "good" : p < 85 ? "bad" : "");
const tgtName = d => (d.vars.Target ? "Target" : Object.keys(d.vars)[0]);
function itemHtml(it) {
  if (it.kind === "player") {
    const p = PL[String(it.id)], pos = p ? p.pos : "";
    return `<li><span class="badge" style="background:${PC[pos] || "var(--k)"}">${pos}</span><span class="lb" title="${it.label}">${it.label}</span><span class="vv">${fmt(it.value)}</span></li>`;
  }
  const r = (it.label.match(/ R(\d)/) || [])[1] || "";
  return `<li><span class="badge" style="background:${r === "1" ? "var(--accent)" : "var(--pick)"}">R${r}</span><span class="lb" title="${it.label}">${it.label}</span><span class="vv">${fmt(it.value)}</span></li>`;
}
function renderCompare() {
  const cmp = sel.cmp || (sel.cmp = {sort: "rank", asset: "all"});
  const assets = [...new Set([...DATA.deals.map(dealAsset), ...MULTI.map(m => m.asset)])];
  const nFor = a => DATA.deals.filter(d => dealAsset(d) === a).length + MULTI.filter(m => m.asset === a).length;
  if (cmp.asset !== "all" && !assets.includes(cmp.asset)) cmp.asset = "all";
  let rows = DATA.deals.map((d, i) => ({d, i}));
  if (cmp.asset !== "all") rows = rows.filter(r => dealAsset(r.d) === cmp.asset);
  if (cmp.sort === "return") rows.sort((a, b) => (dealPct(b.d, tgtName(b.d)) ?? -1) - (dealPct(a.d, tgtName(a.d)) ?? -1) || a.i - b.i);
  else if (cmp.sort === "team") rows.sort((a, b) => a.d.counterparty.localeCompare(b.d.counterparty) || a.i - b.i);
  else if (cmp.sort === "value") rows.sort((a, b) => b.d.vars[tgtName(b.d)].value - a.d.vars[tgtName(a.d)].value || a.i - b.i);

  const el = document.getElementById("compare");
  const opt = (v, label, cur) => `<option value="${v}"${v === cur ? " selected" : ""}>${label}</option>`;
  const h = [`<div class="ctl"><label>Sort ${`<select id="cmp-sort">${opt("rank", "Ranked (as in the brief)", cmp.sort)}${opt("return", "Target return, high to low", cmp.sort)}${opt("value", "Target value, high to low", cmp.sort)}${opt("team", "Team", cmp.sort)}</select>`}</label>
    <label>${DATA.deals.some(d => d.fixed_side === "sends") ? "Selling" : "Buying"} <select id="cmp-asset">${opt("all", `All (${DATA.deals.length + MULTI.length})`, cmp.asset)}${assets.map(a => opt(a, `${a} (${nFor(a)})`, cmp.asset)).join("")}</select></label>
    <span>Return is value received over value sent. Green at 100%+, red under 85%.</span></div><div class="cards">`];
  for (const {d, i} of rows) {
    const t = T[d.cp_rid], sells = d.fixed_side === "sends";
    const vnames = Object.keys(d.vars), tn = tgtName(d);
    const fit = (d.title.match(/\(needs (\w+)\)/) || [])[1];
    h.push(`<article class="dcard"><header><span class="rk">#${i + 1}</span><div>
      <div class="dt">${sells ? `${dealAsset(d)}<span class="arrow">→</span>${t.name}` : `${dealAsset(d)}<span class="arrow">←</span>${t.name}`}${who(t)}</div>
      <div class="dm"><span>${sells ? "you send" : "you receive"} <b>${d.fixed.map(x => x.label).join(", ")}</b> · <b>${fmt(sum(d.fixed))}</b></span><span><b>${t.wins}-${t.losses}</b> · ${ord(t.rank)} of ${DATA.teams.length}</span>${fit ? `<span class="fit">needs ${fit}</span>` : ""}</div>
      </div><button class="open" type="button" data-i="${i}">Open on board</button></header><div class="vgrid">`);
    vnames.forEach((n, k) => {
      const v = d.vars[n], p = dealPct(d, n);
      const prev = k ? d.vars[vnames[k - 1]] : null;
      const same = prev && prev.items.map(keyOf).join() === v.items.map(keyOf).join();
      h.push(`<div class="vcol${n === tn ? " tgt" : ""}"><div class="vh"><span>${n}</span><span class="p ${pctClass(p)}">${p === null ? "–" : p + "%"}</span></div>
        ${same ? `<div class="same">Same package as ${vnames[k - 1]}</div>` : `<ul>${v.items.map(itemHtml).join("")}</ul>`}
        <div class="vt"><span>${sells ? "you receive" : "you send"}</span><b>${fmt(v.value)}</b></div></div>`);
    });
    h.push(`</div><footer><b>Walk away if</b> ${d.walk}.</footer></article>`);
  }
  h.push(`</div>`);
  const ms = MULTI.map((m, i) => ({m, i})).filter(x => cmp.asset === "all" || x.m.asset === cmp.asset);
  if (ms.length) {
    h.push(`<h2 class="sect">Three-team deals (${ms.length})</h2><p class="hint">A buyer that cannot pay in what you want sends players you do not want to a third team, which pays you instead. Kept only when both other teams land between 87% and 115% of what they send and your return beats the buyer's best two-team package. Ranked by the quality of your return.</p><div class="cards">`);
    for (const {m, i} of ms) {
      const [, A, B] = m.teams;
      const got = rid => m.moves.filter(x => x.to === rid), gave = rid => m.moves.filter(x => x.from === rid);
      h.push(`<article class="dcard"><header><span class="rk">T${i + 1}</span><div>
        <div class="dt">${m.asset}<span class="arrow">→</span>${tname(A)}${who(T[A])}<span class="arrow">+</span>${tname(B)}${who(T[B])}</div>
        <div class="dm"><span>${m.why}</span></div></div><button class="open" type="button" data-m="${i}">Open on board</button></header><div class="vgrid">`);
      for (const rid of m.teams) {
        const g = sum(got(rid)), sv = sum(gave(rid)), p = sv ? Math.round(g / sv * 100) : null;
        h.push(`<div class="vcol${rid === ME ? " tgt" : ""}"><div class="vh"><span>${rid === ME ? "You get" : tname(rid) + " gets"}</span><span class="p ${pctClass(p)}">${p === null ? "–" : p + "%"}</span></div>
          <ul>${got(rid).map(x => itemHtml(x).replace("</span><span class=\"vv\">", `<small>from ${x.from === ME ? "you" : tname(x.from)}</small></span><span class="vv">`)).join("")}</ul>
          <div class="vt"><span>gets / sends</span><b>${fmt(g)} / ${fmt(sv)}</b></div></div>`);
      }
      h.push(`</div></article>`);
    }
    h.push(`</div>`);
  }
  el.innerHTML = h.join("");
  el.querySelector("#cmp-sort").onchange = e => { cmp.sort = e.target.value; save(); render(); };
  el.querySelector("#cmp-asset").onchange = e => { cmp.asset = e.target.value; save(); render(); };
  el.querySelectorAll(".open[data-m]").forEach(b => b.onclick = () => {
    const m = MULTI[+b.dataset.m];
    sel = {team: m.teams[1], deal: 0, v: null, custom: {moves: movesOfDeal(m), base: "m" + b.dataset.m}, view: "board", cmp, hist: sel.hist};
    save(); render();
    document.getElementById("board").scrollIntoView({behavior: "smooth", block: "start"});
  });
  el.querySelectorAll(".open[data-i]").forEach(b => b.onclick = () => {
    const d = DATA.deals[+b.dataset.i];
    sel = {team: d.cp_rid, deal: dealsFor(d.cp_rid).indexOf(d), v: null, custom: null, view: "board", cmp, hist: sel.hist};
    save(); render();
    document.getElementById("board").scrollIntoView({behavior: "smooth", block: "start"});
  });
}

function panel(team, hl, isMe, opts = {}) {
  const h = [];
  h.push(`<div class="phead">${opts.removable ? `<button class="unpin" type="button" data-rid="${team.rid}" aria-label="Hide ${team.name}" title="Hide this roster">×</button>` : ""}<h2>${team.name}${who(team)}${isMe ? ' <span style="color:var(--accent)">· you</span>' : ""}${opts.focus ? '<span class="focus">selected</span>' : ""}</h2><div class="meta"><span><b>${team.wins}-${team.losses}</b> · ${ord(team.rank)} of ${DATA.teams.length}</span>${SEASONS.length ? `<span>proj. ${SEASONS[0]} pick <b>${pad(team.proj_slot)}</b></span>` : ""}<span>startable <b>${team.startable}</b></span><span>core age <b>${team.core_age ? team.core_age.toFixed(1) : "–"}</b></span><span>players <b>${fmt(team.player_value)}</b></span><span>picks <b>${fmt(team.pick_value)}</b></span></div></div>`);
  h.push(`<div class="cols"><span>Pos</span><span>Player</span><span>Team</span><span>Age</span><span>PPG</span><span title="Production vs price: rank at the position by PPG against rank by value. + produces better than priced.">P/V</span><span>Value</span></div>`);
  for (const pos of POS) {
    const ps = team.players.filter(p => p.pos === pos);
    if (!ps.length) continue;
    h.push(`<div class="group"><div class="gh">${pos}<span class="bar" style="background:${PC[pos]}"></span><span>${ps.length}</span></div>`);
    for (const p of ps) {
      const m = hl.players[p.id];
      const cls = isMe && DATA.ledger[p.id] ? " " + DATA.ledger[p.id] : "";
      h.push(`<div class="row${m ? " hl " + m : ""}${cls}" data-id="${p.id}" data-key="p:${p.id}" role="button" tabindex="0" aria-pressed="${!!m}"><span class="badge" style="background:${PC[pos]}">${pos}</span><span class="nm">${p.name}${p.ir ? '<span class="tag ir">IR</span>' : (p.inj ? `<small>${p.inj}</small>` : "")}${p.taxi ? '<span class="tag tx">TAXI</span>' : ""}${p.startable ? '<span class="tag st">ST</span>' : ""}${p.sig && p.sig.tag === "buy" ? '<span class="tag bl">BUY LOW</span>' : ""}${p.sig && p.sig.tag === "sell" ? '<span class="tag sh">SELL HIGH</span>' : ""}</span><span class="num">${p.team}</span><span class="num">${p.age ?? ""}</span><span class="num ppg${p.startable ? " good" : ""}">${p.gp ? p.ppg.toFixed(1) : "–"}</span>${pvCell(p)}<span class="num val">${p.value ? fmt(p.value) : "–"}</span></div>`);
    }
    h.push(`</div>`);
  }
  if (SEASONS.length) {
  h.push(`<div class="picks"><div class="gh">Draft picks<span class="bar" style="background:var(--pick)"></span><span>${fmt(team.pick_value)}</span></div>`);
  for (const yr of SEASONS) {
    const ps = team.picks.filter(p => p.season === yr);
    h.push(`<div class="season"><div class="yr">${yr}</div><div class="chips">`);
    if (!ps.length) h.push(`<span class="none">none</span>`);
    for (const p of ps) {
      const m = hl.picks[p.key];
      h.push(`<span class="chip${m ? " hl " + m : ""}" data-key="k:${p.key}" role="button" tabindex="0" aria-pressed="${!!m}"><span class="r r${p.round}">R${p.round}</span>${p.own ? "own" : "via " + p.orig}${p.proj_slot && p.round === 1 ? `<small>${pad(p.proj_slot)}</small>` : ""}<span class="v">${fmt(p.value)}</span></span>`);
    }
    h.push(`</div></div>`);
  }
  h.push(`</div>`);
  }
  return h.join("");
}

function pvCell(p) {
  const s = p.sig;
  if (!s) return `<span class="num pv" title="Fewer than 4 games with points: no production read yet">–</span>`;
  const dir = s.gap > 0 ? " up" : (s.gap < 0 ? " down" : "");
  const tip = `${p.pos}${s.prod} by PPG, ${p.pos}${s.price} by value (of ${s.n} rostered ${p.pos}s with 4+ games)`;
  return `<span class="num pv${dir}${s.tag ? " tagged" : ""}" title="${tip}">${s.gap > 0 ? "+" : ""}${s.gap}</span>`;
}

// League trades view: how the league prices things, who trades well, and every trade priced then and now.
const sgn = n => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(Math.round(n)));
const pctCls = p => (p === null || p === undefined ? "mid" : p >= 108 ? "good" : p <= 92 ? "bad" : "mid");
function renderHistory() {
  const H = DATA.trade_history, st = sel.hist || (sel.hist = {sort: "net_now", dir: -1, uid: "all", season: "all"});
  const el = document.getElementById("history");
  const h = [];

  // 1. how the league prices things
  const M = H.market;
  const mrow = (label, r) => `<tr><td class="l">${label}</td><td>${r.trades}</td><td>${r.value !== undefined ? fmt(r.value) : ""}</td><td class="${pctCls(r.pct)}">${r.pct === null ? "–" : r.pct + "%"}</td><td class="l">${r.read}</td></tr>`;
  h.push(`<div class="hsec"><h2>How this league trades</h2>
    <p class="hint">For each kind of asset, what sellers got back, against the DynastyProcess value the week of the trade (${M.trades} two-team trades). Over 100%: this league pays more than market, so it is a good thing to sell here. Under 100%: it goes cheap here, so it is a good thing to buy. Fewer than 5 trades is marked thin.</p>
    <div class="tw"><table class="ht"><thead><tr><th>When someone sells</th><th>Trades</th><th>Value sold</th><th>Got back</th><th class="l">Read</th></tr></thead><tbody>
    ${M.rows.map(r => mrow(r.label, r)).join("")}
    ${mrow("A stud for 2+ smaller pieces", {...M.consolidation, value: undefined})}
    </tbody></table></div>
    <p class="hint">Later-round picks are mostly throw-ins, so their number moves with whatever deal they were added to. Each side's return is spread over what it sent by value, so one lopsided trade can tilt a small category.</p></div>`);

  // 2. who trades well
  const cols = [["manager", "Manager", 1], ["trades", "Trades", -1], ["won", "Won-lost-even", -1], ["pct_then", "Return at trade", -1], ["net_then", "Net value at trade", -1], ["net_now", "Net value today", -1], ["pts", "Net starter pts", -1]];
  const rows = [...H.managers].sort((a, b) => {
    const k = st.sort, av = a[k] ?? -Infinity, bv = b[k] ?? -Infinity;
    return (typeof av === "string" ? av.localeCompare(bv) : (av - bv)) * st.dir;
  });
  h.push(`<div class="hsec"><h2>Who trades well</h2>
    <p class="hint">Won-lost-even uses today's values: a side wins when it got 10% and 150+ value more than it gave. Return at trade is everything received over everything sent, at the values of each trade's week. Net starter points: what a manager's acquisitions scored in their starting lineup since, minus what they gave up scored in the other team's. Click a manager to filter the trades below.</p>
    <div class="tw"><table class="ht lb"><thead><tr>${cols.map(([k, l, d]) => `<th${st.sort === k ? ` aria-sort="${st.dir > 0 ? "ascending" : "descending"}"` : ""}><button type="button" data-k="${k}" data-d="${d}">${l}${st.sort === k ? (st.dir > 0 ? " ▲" : " ▼") : ""}</button></th>`).join("")}</tr></thead><tbody>
    ${rows.map(r => `<tr data-uid="${r.uid}" class="${r.uid === DATA.me_uid ? "me" : ""}${st.uid === r.uid ? " on" : ""}"><td class="l"><b>${r.manager}</b>${r.uid === DATA.me_uid ? ' <span style="color:var(--accent)">· you</span>' : ""}<small>${r.teams.filter(t => t !== r.manager).join(" · ")}</small></td>
      <td>${r.trades}</td><td>${r.won}-${r.lost}-${r.even}</td><td class="${pctCls(r.pct_then)}">${r.pct_then === null ? "–" : r.pct_then + "%"}</td>
      <td class="${r.net_then > 0 ? "good" : r.net_then < 0 ? "bad" : "mid"}">${sgn(r.net_then)}</td><td class="${r.net_now > 0 ? "good" : r.net_now < 0 ? "bad" : "mid"}">${sgn(r.net_now)}</td>
      <td class="${r.pts > 0 ? "good" : r.pts < 0 ? "bad" : "mid"}">${sgn(r.pts)}</td></tr>`).join("")}
    </tbody></table></div></div>`);

  // 3. every trade
  const seasons = [...new Set(H.trades.map(t => t.season))].sort((a, b) => b - a);
  const opt = (v, label, cur) => `<option value="${v}"${String(v) === String(cur) ? " selected" : ""}>${label}</option>`;
  let list = H.trades;
  if (st.uid !== "all") list = list.filter(t => t.sides.some(s => s.uid === st.uid));
  if (st.season !== "all") list = list.filter(t => String(t.season) === String(st.season));
  const mgrs = [...H.managers].sort((a, b) => a.manager.localeCompare(b.manager));
  h.push(`<div class="hsec"><h2>Trades</h2><div class="ctl">
    <label>Manager <select id="h-uid">${opt("all", "Everyone", st.uid)}${mgrs.map(m => opt(m.uid, `${m.manager} (${m.trades})`, st.uid)).join("")}</select></label>
    <label>Season <select id="h-season">${opt("all", "All", st.season)}${seasons.map(y => opt(y, y, st.season)).join("")}</select></label>
    <span>${list.length} trade${list.length === 1 ? "" : "s"} · values shown as then → today</span></div><div class="tlist">`);
  const itemLi = a => {
    if (a.kind === "player") return `<li><span class="badge" style="background:${PC[a.pos] || "var(--k)"}">${a.pos}</span><span class="lb">${a.label}${a.age ? `<small>${Math.floor(a.age)}</small>` : ""}</span><span class="vv">${fmt(a.then)} → <b>${fmt(a.now)}</b></span></li>`;
    return `<li><span class="badge" style="background:${a.round === 1 ? "var(--accent)" : "var(--pick)"}">R${a.round}</span><span class="lb">${a.label}${a.became ? `<small>→ ${a.became}</small>` : ""}</span><span class="vv">${fmt(a.then)} → <b>${fmt(a.now)}</b></span></li>`;
  };
  for (const t of list) {
    const byRid = Object.fromEntries(t.sides.map(s => [s.rid, s]));
    const wNow = t.winner_now != null ? byRid[t.winner_now] : null, wThen = t.winner_then != null ? byRid[t.winner_then] : null;
    const early = t.days_ago < 56;
    const mine = t.sides.some(s => s.uid === DATA.me_uid);
    h.push(`<article class="tcard${mine ? " mine" : ""}"><header><span><b>${t.date}</b> · ${t.season} week ${t.week} · ${t.values_asof ? `values of ${t.values_asof}` : "no values from then"}</span>
      <span>${!t.values_asof ? "Unpriced at the time" : wThen ? `${wThen.manager} won at the time` : "Fair at the time"} · <span class="vbadge${wNow ? " win" : ""}">${wNow ? `${wNow.manager} wins today` : "Even today"}${early ? " (early)" : ""}</span></span></header><div class="tsides">`);
    for (const s of t.sides) {
      h.push(`<div class="tside${wNow && wNow === s ? " won" : ""}"><div class="tsh"><b>${s.team}</b>${s.team !== s.manager ? ` <small>(${s.manager})</small>` : ""} <small>gets</small></div>
        <ul>${s.gets.map(itemLi).join("") || '<li><span></span><span class="lb" style="color:var(--muted)">nothing</span><span></span></li>'}</ul>
        ${s.faab ? `<div class="hint">${s.faab > 0 ? "+" : "−"}$${Math.abs(s.faab)} FAAB (not valued)</div>` : ""}
        <div class="tst"><span>At the time</span><span><b>${fmt(s.got_then)}</b> for ${fmt(s.gave_then)} · <span class="${pctCls(s.pct_then)}">${s.pct_then === null ? "–" : s.pct_then + "%"}</span></span>
        <span>Today</span><span><b>${fmt(s.got_now)}</b> for ${fmt(s.gave_now)} · <span class="${pctCls(s.pct_now)}">${s.pct_now === null ? "–" : s.pct_now + "%"}</span></span>
        <span>Starter pts</span><span><b>${s.pts.toFixed(1)}</b> since, for this team</span></div></div>`);
    }
    h.push(`</div></article>`);
  }
  h.push(`</div><p class="hint">Picks are priced at the time by their exact slot when that draft was next, mid-round the season after, flat beyond. Today a drafted pick is worth the player taken with it; an undrafted one is priced like the board's picks. FAAB is not valued. Trades from before the values feed began (February 2019) are shown but not priced at the time. Values only: a deal that won a title can still lose on today's values.</p></div>`);
  el.innerHTML = h.join("");

  el.querySelectorAll(".ht.lb th button").forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    st.dir = st.sort === k ? -st.dir : +b.dataset.d;
    st.sort = k; save(); render();
  });
  el.querySelectorAll(".ht.lb tbody tr").forEach(r => r.onclick = () => { st.uid = st.uid === r.dataset.uid ? "all" : r.dataset.uid; save(); render(); });
  el.querySelector("#h-uid").onchange = e => { st.uid = e.target.value; save(); render(); };
  el.querySelector("#h-season").onchange = e => { st.season = e.target.value; save(); render(); };
}

function render() {
  const other = T[sel.team];
  document.getElementById("h1").innerHTML = `${DATA.league} Trade Board <span class="call">${DATA.mode}</span>`;
  document.getElementById("sub").textContent = `${DATA.season} · week ${DATA.week} · values as of ${DATA.asof} · ${me.name} vs ${other.name}${handle(other) ? ` (${handle(other)})` : ""}`;
  document.getElementById("summary").innerHTML = `<b>The call: ${DATA.mode}.</b> ${DATA.call_text}<ul>${DATA.reasons.map(r => `<li>${r}</li>`).join("")}</ul>`;
  document.getElementById("note").textContent = DATA.note;

  const TH_ = DATA.trade_history, nHist = TH_ ? TH_.trades.length : 0;
  const nDeals = DATA.deals.length + MULTI.length;
  const view = (sel.view === "compare" && nDeals) ? "compare" : (sel.view === "history" && nHist) ? "history" : "board";
  const views = document.getElementById("views");
  views.hidden = !nDeals && !nHist;
  views.innerHTML = `<button class="view" role="tab" aria-selected="${view === "board"}" data-view="board">Trade board</button>`
    + (nDeals ? `<button class="view" role="tab" aria-selected="${view === "compare"}" data-view="compare">All deals (${nDeals})</button>` : "")
    + (nHist ? `<button class="view" role="tab" aria-selected="${view === "history"}" data-view="history">League trades (${nHist})</button>` : "");
  views.querySelectorAll(".view").forEach(b => b.onclick = () => { sel.view = b.dataset.view; save(); render(); });
  const tabs = document.getElementById("tabs");
  tabs.hidden = document.getElementById("board").hidden = view !== "board";
  document.getElementById("compare").hidden = view !== "compare";
  document.getElementById("history").hidden = view !== "history";
  if (view === "compare") {
    document.getElementById("sub").textContent = `${DATA.season} · week ${DATA.week} · values as of ${DATA.asof} · ${DATA.deals.length} two-team and ${MULTI.length} three-team deals across ${withDeals.length} teams`;
    renderCompare();
    return;
  }
  if (view === "history") {
    const yrs = [...new Set(TH_.trades.map(t => t.season))].sort();
    document.getElementById("sub").textContent = `${nHist} trades, ${yrs[0]} to ${yrs[yrs.length - 1]} · each priced with the DynastyProcess values of its week, and with today's (${TH_.values_now})`;
    renderHistory();
    return;
  }

  // Which rosters are on screen: yours, the selected team, any pinned with the tab's + button, and every team in the trade.
  const pins = (sel.pins || []).filter(r => T[r] && r !== ME);
  const custom = sel.custom || null;
  const inTrade = custom ? [...new Set(custom.moves.flatMap(m => [m.from, m.to]))].filter(r => T[r] && r !== ME) : [];
  const shown = [ME, other.rid, ...pins, ...inTrade].filter((r, k, a) => a.indexOf(r) === k);

  tabs.innerHTML = others.map(r => `<span class="tabw"><button class="tab${shown.includes(r) ? " shown" : ""}" role="tab" aria-selected="${r === sel.team}" data-team="${r}">${T[r].name}${who(T[r])}${withDeals.includes(r) ? '<span class="dot"></span>' : ""}</button><button class="pin" type="button" data-pin="${r}" aria-pressed="${pins.includes(r)}" title="${pins.includes(r) ? "Unpin this roster" : "Show this roster alongside"}" aria-label="${pins.includes(r) ? "Unpin" : "Pin"} ${T[r].name}">${pins.includes(r) ? "−" : "+"}</button></span>`).join("");
  // selecting a team keeps pins and any trade in progress (that is how more teams' pieces get added); an empty trade is dropped
  tabs.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    const keep = sel.custom && sel.custom.moves.length ? sel.custom : null;
    sel = {...sel, team: +b.dataset.team, deal: 0, v: null, view: "board", custom: keep};
    save(); render();
  });
  const togglePin = rid => {
    const ps = (sel.pins || []).filter(r => r !== rid);
    if (ps.length === (sel.pins || []).length) ps.push(rid);
    sel.pins = ps; save(); render();
  };
  tabs.querySelectorAll(".pin").forEach(b => b.onclick = () => togglePin(+b.dataset.pin));

  const deals = dealsFor(other.rid), mlist = multiFor(other.rid);
  const deal = deals[sel.deal] || null;
  const vnames = deal ? Object.keys(deal.vars) : [];
  const v = deal ? (vnames.includes(sel.v) ? sel.v : (vnames.includes("Target") ? "Target" : vnames[0])) : null;
  let moves = [];
  if (custom) moves = custom.moves;
  else if (deal) {
    const varItems = deal.vars[v].items;
    const [sendItems, recvItems] = deal.fixed_side === "sends" ? [deal.fixed, varItems] : [varItems, deal.fixed];
    moves = [...sendItems.map(i => ({key: keyOf(i), from: ME, to: other.rid})), ...recvItems.map(i => ({key: keyOf(i), from: other.rid, to: ME}))];
  }
  const R = moves.map((mv, idx) => ({...mv, idx, a: T[mv.from] && assetOf(T[mv.from], mv.key)})).filter(x => x.a);
  const hl = {players: {}, picks: {}};
  for (const x of R) {
    const cls = x.from === ME ? "send" : (x.to === ME ? "recv" : "other");
    if (x.a.kind === "player") hl.players[x.a.id] = cls; else hl.picks[x.a.key] = cls;
  }
  document.getElementById("board").classList.toggle("duo", shown.length <= 2);
  const ros = document.getElementById("rosters");
  ros.innerHTML = shown.map(rid => `<section class="panel" data-rid="${rid}" aria-label="${T[rid].name} roster">${panel(T[rid], hl, rid === ME, {focus: rid === other.rid, removable: pins.includes(rid) && !inTrade.includes(rid) && rid !== other.rid})}</section>`).join("");
  ros.querySelectorAll(".unpin").forEach(b => b.onclick = () => togglePin(+b.dataset.rid));

  // Clicking an asset forks the shown proposal into a custom trade (or edits the one in progress). From your roster it goes
  // to the selected team; from anyone else's it comes to you. Each piece's "to" can then send it anywhere.
  const toggle = (rid, key) => {
    if (!sel.custom) sel.custom = {moves: moves.map(m => ({key: m.key, from: m.from, to: m.to})), base: null};
    const ms = sel.custom.moves, i = ms.findIndex(m => m.key === key && m.from === rid);
    if (i >= 0) ms.splice(i, 1); else ms.push({key, from: rid, to: rid === ME ? other.rid : ME});
    refocus = {rid, key};
    save(); render();
  };
  ros.querySelectorAll("section[data-rid]").forEach(sec => {
    const rid = +sec.dataset.rid;
    sec.querySelectorAll("[data-key]").forEach(n => {
      n.onclick = () => toggle(rid, n.dataset.key);
      n.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(rid, n.dataset.key); } };
    });
  });
  if (refocus) {
    const n = ros.querySelector(`section[data-rid="${refocus.rid}"] [data-key="${CSS.escape(refocus.key)}"]`);
    if (n && document.activeElement === document.body) n.focus({preventScroll: true});
    refocus = null;
  }

  // The deal strip: deals with the selected team on the left, the current trade on the right, one block per team in it.
  const rail = document.getElementById("rail");
  const baseIdx = custom && custom.base ? +custom.base.slice(1) : null;
  const isBase = baseIdx !== null && MULTI[baseIdx] && sameMoves(custom.moves, movesOfDeal(MULTI[baseIdx]));
  const teamsIn = [...new Set(R.flatMap(x => [x.from, x.to]))];
  const order = [ME, other.rid, ...teamsIn, ...shown].filter((r, k, a) => a.indexOf(r) === k && T[r]);
  const multi = teamsIn.length > 2;   // three or more teams: the trade takes the strip's full width and the deal list steps aside
  const gotOf = rid => R.filter(x => x.to === rid), gaveOf = rid => R.filter(x => x.from === rid);
  const tot = xs => xs.reduce((a, x) => a + x.a.value, 0);
  const pctOf = rid => { const g = tot(gaveOf(rid)); return g ? Math.round(tot(gotOf(rid)) / g * 100) : null; };
  const pcls = p => (p === null ? "" : (p >= 100 ? "good" : (p < 85 ? "bad" : "")));
  const li = x => `<li draggable="true" data-i="${x.idx}" data-from="${x.from}" title="Drag onto another team to send it there"><span class="il">${x.a.label}<small>from ${x.from === ME ? "you" : tname(x.from)}</small></span><span class="iv">${fmt(x.a.value)}</span>${custom ? `<button class="rm" type="button" data-i="${x.idx}" aria-label="Remove ${x.a.label}">×</button>` : ""}</li>`;
  const empty = `<li class="empty">nothing yet</li>`;

  const left = `<div class="panel"><h3>Deals with ${other.name}${who(other)}</h3>
    ${deals.length || mlist.length ? `<div class="deals">${deals.map((d, i) => `<button class="deal" aria-selected="${!custom && i === sel.deal}" data-i="${i}">${d.title}<small>${d.fixed_side === "sends" ? d.fixed.map(x => x.label).join(", ") + " out" : d.fixed.map(x => x.label).join(", ") + " in"}</small></button>`).join("")}
      ${mlist.map(({m, i}) => `<button class="deal multi" aria-selected="${isBase && baseIdx === i}" data-m="${i}">${m.title}<small>${m.teams.filter(r => r !== ME).map(tname).join(" + ")}</small></button>`).join("")}</div>`
      : `<p class="note">Nothing drafted with ${other.name}: ${DATA.mode === "contend" ? "no older producer at your weak spots" : "not a contender with pick capital, or nothing on your sell list fits"}.</p>`}
    ${deal ? `<div class="vars${custom ? " custom" : ""}">${vnames.map(n => `<button class="var" aria-selected="${!custom && n === v}" data-v="${n}">${n}</button>`).join("")}</div>` : ""}
    <p class="hint">Use a tab's <b>+</b> to put more rosters on screen; scroll sideways to see them all.</p></div>`;

  let right;
  if (!R.length && !custom) {
    right = `<div class="panel"><h3>Trade</h3><p class="hint">Pick a deal, or click players and picks on any roster below to build your own. A piece from your roster goes to the selected team; a piece from any other roster comes to you.</p></div>`;
  } else {
    const title = custom ? (isBase ? "Three-team deal" : (baseIdx !== null ? "Custom trade (from a three-team deal)" : (teamsIn.length > 2 ? "Custom multi-team trade" : "Custom trade"))) : (deal ? `${deal.title} · ${v}` : "Trade");
    const blocks = order.map(rid => {
      const p = pctOf(rid), got = gotOf(rid);
      return `<div class="mside${rid === ME ? " me" : ""}" data-drop="${rid}"><div class="mh"><span><b>${rid === ME ? "You" : tname(rid)}</b>${rid !== ME ? who(T[rid]) : ""} get${rid === ME ? "" : "s"}</span><span class="p ${pcls(p)}">${p === null ? "–" : p + "%"}</span></div>
        <ul class="side" style="list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:3px">${got.map(li).join("") || empty}</ul>
        <div class="mt">gets <b>${fmt(tot(got))}</b> for <b>${fmt(tot(gaveOf(rid)))}</b> sent</div></div>`;
    }).join("");
    const myP = pctOf(ME);
    const foot = custom
      ? `<p class="hint">Click rows on any roster to add or remove pieces. Drag a piece onto another team, here or on its roster, to send it there. ${multi ? "Clear brings the deal list back." : (deal ? "Ask, Target or Floor go back to the drafted deal." : "")}</p>`
      : `<div class="walk"><b>Walk away if</b> ${deal.walk}.</div>`;
    right = `<div class="panel"><div class="custom-head" style="margin-top:0"><span>${title}</span>${custom ? `<button class="clear" type="button">Clear</button>` : ""}</div>
      <div class="mgrid">${blocks}</div>
      <div class="tfoot"><span>Your return on what you send</span><span class="big ${pcls(myP)}">${myP === null ? "–" : myP + "%"}</span></div>
      ${isBase ? `<p class="why">${MULTI[baseIdx].why}</p>` : ""}${foot}</div>`;
  }
  rail.innerHTML = multi ? right : left + right;
  rail.classList.toggle("solo", multi);
  rail.querySelectorAll(".deal[data-i]").forEach(b => b.onclick = () => { sel.deal = +b.dataset.i; sel.v = null; sel.custom = null; save(); render(); });
  rail.querySelectorAll(".deal[data-m]").forEach(b => b.onclick = () => { sel.custom = {moves: movesOfDeal(MULTI[+b.dataset.m]), base: "m" + b.dataset.m}; save(); render(); });
  rail.querySelectorAll(".var").forEach(b => b.onclick = () => { sel.v = b.dataset.v; sel.custom = null; save(); render(); });
  rail.querySelectorAll(".rm").forEach(b => b.onclick = () => { sel.custom.moves.splice(+b.dataset.i, 1); save(); render(); });

  // Drag a piece in the trade onto any team's block above or its roster below to send it there instead.
  ros.querySelectorAll("section[data-rid]").forEach(sec => sec.dataset.drop = sec.dataset.rid);
  const targets = () => document.querySelectorAll("#board [data-drop]");
  const sendTo = (i, rid) => {
    if (!sel.custom) sel.custom = {moves: moves.map(m => ({key: m.key, from: m.from, to: m.to})), base: null};
    const m = sel.custom.moves[i];
    if (!m || rid === m.from || rid === m.to) return;
    m.to = rid; save(); render();
  };
  let drag = null;
  rail.querySelectorAll(".side li[draggable]").forEach(n => {
    n.ondragstart = e => {
      drag = {i: +n.dataset.i, from: +n.dataset.from};
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", n.dataset.i);
      n.classList.add("dragging");
      targets().forEach(t => { if (+t.dataset.drop !== drag.from) t.classList.add("drop-ok"); });
    };
    n.ondragend = () => { drag = null; n.classList.remove("dragging"); targets().forEach(t => t.classList.remove("drop-ok", "drop-over")); };
  });
  targets().forEach(t => {
    const rid = +t.dataset.drop;
    t.ondragover = e => { if (drag && rid !== drag.from) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; t.classList.add("drop-over"); } };
    t.ondragleave = e => { if (!t.contains(e.relatedTarget)) t.classList.remove("drop-over"); };
    t.ondrop = e => { if (!drag || rid === drag.from) return; e.preventDefault(); const i = drag.i; drag = null; sendTo(i, rid); };
  });
  const clear = rail.querySelector(".clear");
  if (clear) clear.onclick = () => { sel.custom = {moves: [], base: null}; save(); render(); };
  sel.v = v;
}
render();
</script>
</body>
</html>
